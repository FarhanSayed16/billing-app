services:
  - type: web
    name: billpush-backend
    env: node
    plan: free
    rootDir: backend
    # --include=dev is required: NODE_ENV=production would skip @nestjs/cli and break `nest build`
    # Baseline during build so a dashboard start command that still runs
    # `prisma migrate deploy` succeeds against an existing Supabase schema (P3005).
    buildCommand: "npm install --include=dev && npx prisma generate && npx nest build && node scripts/prisma-migrate-prod.mjs"
    startCommand: "npm run start:render"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_MOCK
        value: "false"
      - key: NODE_ENV
        value: production
      - key: ENABLE_GUEST_LOGIN
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: FIREBASE_CREDENTIALS
        sync: false
